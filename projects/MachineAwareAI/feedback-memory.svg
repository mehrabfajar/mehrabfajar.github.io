<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="430" viewBox="0 0 1300 430" role="img" aria-labelledby="title desc">
  <title id="title">MachineAware AI feedback and validated case-memory lifecycle</title>
  <desc id="desc">A flow from question to response, operator feedback, confirmed resolution, validated case, and future Context-Aware retrieval. It is case memory, not RLHF or model retraining.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D6A85F"/></marker><style>.bg{fill:#0D1117}.node{fill:#161D25;stroke:#4B5662;stroke-width:1.4}.human{stroke:#D6A85F}.valid{stroke:#58B7A5}.title{fill:#F0F6FC;font:600 28px Inter,Segoe UI,sans-serif}.label{fill:#F0F6FC;font:600 14px Inter,Segoe UI,sans-serif}.small{fill:#9BA7B4;font:400 12px Inter,Segoe UI,sans-serif}.tag{fill:#7ED0C0;font:600 12px Inter,Segoe UI,sans-serif;letter-spacing:.5px}.line{fill:none;stroke:#D6A85F;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1300" height="430" rx="18"/><text class="title" x="48" y="56">Human feedback → validated case memory</text><text class="small" x="48" y="81">Only explicitly confirmed resolutions become retrievable cases</text>
  <rect class="node" x="48" y="150" width="150" height="78" rx="12"/><text class="label" x="123" y="195" text-anchor="middle">Question</text>
  <rect class="node" x="252" y="150" width="150" height="78" rx="12"/><text class="label" x="327" y="195" text-anchor="middle">Response</text>
  <rect class="node human" x="456" y="150" width="165" height="78" rx="12"/><text class="label" x="538" y="184" text-anchor="middle">Operator</text><text class="label" x="538" y="204" text-anchor="middle">feedback</text>
  <rect class="node human" x="675" y="150" width="175" height="78" rx="12"/><text class="label" x="762" y="184" text-anchor="middle">Confirmed</text><text class="label" x="762" y="204" text-anchor="middle">resolution</text>
  <rect class="node valid" x="904" y="150" width="155" height="78" rx="12"/><text class="label" x="981" y="184" text-anchor="middle">Validated</text><text class="label" x="981" y="204" text-anchor="middle">case</text>
  <rect class="node valid" x="1113" y="150" width="155" height="78" rx="12"/><text class="label" x="1190" y="184" text-anchor="middle">Future Context-</text><text class="label" x="1190" y="204" text-anchor="middle">Aware retrieval</text>
  <path class="line" d="M198 189H252"/><path class="line" d="M402 189H456"/><path class="line" d="M621 189H675"/><path class="line" d="M850 189H904"/><path class="line" d="M1059 189H1113"/>
  <text class="small" x="538" y="258" text-anchor="middle">Useful / Not useful is not truth</text>
  <text class="small" x="762" y="258" text-anchor="middle">Root cause · action · outcome</text>
  <text class="small" x="981" y="258" text-anchor="middle">Stored with validation status</text>
  <rect x="194" y="318" width="912" height="66" rx="14" fill="#111820" stroke="#27313B"/>
  <text class="tag" x="650" y="346" text-anchor="middle">TRANSPARENT LOCAL CASE MEMORY</text>
  <text class="small" x="650" y="369" text-anchor="middle">Not RLHF · No fine-tuning · No model retraining · Never available to Manual RAG</text>
</svg>
